      <text x="148" y="869" font-size="21" font-weight="700" fill="#344441">Task title</text>
      <rect x="148" y="889" width="784" height="72" rx="16" fill="#fff" stroke="#dfe7e4" stroke-width="2"/>
      <text x="174" y="935" font-size="23" fill="#899592">e.g. Help me move a sofa</text>
      <text x="148" y="1015" font-size="21" font-weight="700" fill="#344441">Category</text>
