    <text x="154" y="122" font-size="42" font-weight="800" fill="#172b2a">Tasker</text><text x="294" y="122" font-size="42" font-weight="800" fill="#ef6b5b">PH</text>
    <text x="76" y="238" font-size="21" font-weight="700" letter-spacing="4" fill="#b95e48">YOUR TASK. YOUR TERMS.</text>
